<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact|Portfolio-WebPage</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <header class="header">
      <div class="header-logo">
        <img src="./images/logo (1).png" alt="" />
      </div>
      <nav class="header-navbar">
        <ul>
          <li>
            <a href="index.html">Home</a>
          </li>
          <li>
            <a href="about.html">About</a>
          </li>
          <li>
            <a href="services.html">Services</a>
          </li>
          <li>
            <a href="portfolio.html">Portfolio</a>
          </li>
          <li>
            <a href="#page">Page</a>
          </li>
          <li>
            <a href="contact.html">Contact</a>
          </li>
        </ul>
        <div class="header-navbar-btn">
          <button>Get Free Consultent</button>
        </div>
      </nav>
      <div class="menu-toggle">
        <i class="fa-solid fa-bars"></i>
      </div>
    </header>

    <!----- Contact-Section----- -->
    <section class="contact-Section">
      <div class="Contact-section-container">
        <div class="contact-section-title">
          <h2>Contact Us</h2>
          <span>Home / Contact</span>
        </div>
      </div>
    </section>

    <!-- Contact Us Detail Section -->
    <section class="Contact-section">
      <!-- Google Map -->
      <div class="map-container">
        <iframe
          src="https://www.google.com/maps/embed?pb="
          width="100%"
          height="450"
          style="border: 0"
          allowfullscreen=""
          loading="lazy"
        >
        </iframe>
      </div>

      <!-- Bottom Content -->
      <div class="contact-content">
        <!-- Left Side Form -->
        <div class="contact-form">
          <h2>Get in Touch</h2>

          <form>
            <textarea placeholder="Enter Message" rows="8"> </textarea>

            <div class="input-row">
              <input type="text" placeholder="Your Name" />
              <input type="email" placeholder="Your Email" />
            </div>

            <input type="text" placeholder="Subject" />

            <button type="submit">Send Message</button>
          </form>
        </div>

        <!-- Right Side Contact Info -->
        <div class="contact-info">
          <div class="info-box">
            <i class="fa-solid fa-house"></i>
            <div>
              <h4>Buttonwood, California.</h4>
              <p>Rosemead, CA 91770</p>
            </div>
          </div>

          <div class="info-box">
            <i class="fa-solid fa-phone"></i>
            <div>
              <h4>+1 253 565 2365</h4>
              <p>Mon to Fri 9am to 6pm</p>
            </div>
          </div>

          <div class="info-box">
            <i class="fa-solid fa-envelope"></i>
            <div>
              <h4>support@colorlib.com</h4>
              <p>Send us your query anytime!</p>
            </div>
          </div>
        </div>
      </div>
    </section>

    <script src="https://unpkg.com/@studio-freight/lenis@1.0.42/bundled/lenis.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.7/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.7/ScrollTrigger.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
